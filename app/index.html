        if (currentIndex < feed.length - 1) {
          setCurrentIndex(prev => prev + 1);
          setLiked(false);
          setShowChat(false);
        }
      };

      const handlePrev = () => {
        if (currentIndex > 0) {
          setCurrentIndex(prev => prev - 1);
          setLiked(false);
          setShowChat(false);
        }
      };

        e.preventDefault();
        if (!commentText.trim()) return;
        const newComment = { id: Date.now(), user: 'you', text: commentText };

        updatedFeed[currentIndex].comments.push(newComment);
        setFeed(updatedFeed);
        setCommentText('');
      };
